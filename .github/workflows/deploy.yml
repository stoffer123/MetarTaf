name: build-and-deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/stoffer123/metartaf:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/metartaf

            # Login til GHCR hvis image er privat (ellers springes over)
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u stoffer123 --password-stdin
            fi

            # Pull og tjek om noget faktisk blev opdateret
            if docker compose pull app 2>&1 | tee /tmp/pull.log | grep -qiE 'Downloaded newer image|Pull complete|Digest:'; then
              echo "Ny version fundet → genstarter…"
              docker compose up -d
            else
              echo "Ingen ændring → skipper genstart."
            fi

            # Ryd gamle lag (valgfrit)
            docker image prune -f --filter "until=24h" >/dev/null 2>&1 || true

